# Builds the archives tested by release-artifacts.yml. Publication of those
# exact assets is owned by release.yml, including generated release notes.
# Local preview: goreleaser release --snapshot --clean --skip=publish

version: 2

project_name: idiom

builds:
  - id: idiom
    main: ./cmd/idiom
    binary: idiom
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows arm64 does not yet have an installer/CI support contract.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: idiom
    formats: [tar.gz]
    # Override the format for windows so users get a familiar zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - third-party-licenses/manifest.json
      - src: third-party-licenses/**/*

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz
  files:
    - vendor/modules.txt
    - vendor/**/*
    - third-party-licenses/manifest.json
    - third-party-licenses/**/*

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: BLuchterhand
    name: idiom
