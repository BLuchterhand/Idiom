# goreleaser config for `idiom` — Phase 9 (distribution).
#
# Triggered by `gh release create vX.Y.Z`; the release workflow at
# .github/workflows/release.yml runs `goreleaser release` on tag push.
# Local dry-run: `goreleaser release --snapshot --clean --skip=publish`
# (requires goreleaser v2+; see https://goreleaser.com).
#
# What this config ships per release:
#   - cross-compiled `idiom` binaries for darwin/linux/windows
#   - SHA256SUMS file for install.sh checksum verification
#   - tarball + zip archives with the binary, README, LICENSE
#   - GitHub release with autogenerated changelog from commit messages
#
# Out of scope here (handled separately):
#   - macOS notarization (needs Apple Developer credentials in CI secrets;
#     wire `gon` or `quill` once the Developer ID is provisioned)
#   - Homebrew tap (separate `idiom-sh/tap` repo; goreleaser's `brews:`
#     section publishes there once the tap exists)
#   - Other binaries in cmd/* (idiom-eval, idiom-swe-eval, etc.) —
#     ship those as a separate config when there's user demand.

version: 2

project_name: idiom

before:
  hooks:
    - go mod tidy

builds:
  - id: idiom
    main: ./cmd/idiom
    binary: idiom
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Skip windows/arm64 — vanishingly rare host for a dev tool, and
      # CI minutes aren't free.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: idiom
    formats: [tar.gz]
    # Override the format for windows so users get a familiar zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      # No LICENSE file in the repo today. Once a license is chosen
      # and added to the repo root, restore `LICENSE*` here so the
      # archive carries it alongside the binary.

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: BLuchterhand
    name: idiom
  draft: false
  # Pre-release auto-flag: anything with -rc, -beta, -alpha, -snapshot is
  # marked pre-release on GitHub. Stable tags (vX.Y.Z) ship as latest.
  prerelease: auto
  header: |
    `idiom` {{ .Tag }}.

    See [docs/idiom-design-roadmap.md](https://github.com/BLuchterhand/idiom/blob/main/docs/idiom-design-roadmap.md) for the current roadmap and release scope.
  footer: |
    ## Install

    macOS / Linux amd64 or arm64:

    ```
    curl -fsSL https://raw.githubusercontent.com/BLuchterhand/idiom/main/install.sh | sh
    ```

    Full harness install with discovery dependencies on macOS / Linux amd64 or arm64:

    ```
    curl -fsSL https://raw.githubusercontent.com/BLuchterhand/idiom/main/install.sh | sh -s -- --profile full
    ```

    Tool sidecar only on macOS / Linux amd64 or arm64 (no model harness or queue setup):

    ```
    curl -fsSL https://raw.githubusercontent.com/BLuchterhand/idiom/main/install.sh | sh -s -- --profile tools
    ```

    Existing Unix scripts can keep using `install-tools.sh`; it is a compatibility wrapper for the tools profile.

    All installer profiles initialize missing user-global config artifacts under
    `~/.idiom` and preserve files that already exist.

    Windows PowerShell full CLI (windows/amd64):

    ```powershell
    irm https://raw.githubusercontent.com/BLuchterhand/idiom/main/install.ps1 | iex
    ```

    Windows PowerShell full harness install with discovery dependencies (windows/amd64):

    ```powershell
    & ([scriptblock]::Create((irm https://raw.githubusercontent.com/BLuchterhand/idiom/main/install.ps1))) -Profile Full
    ```

    Windows PowerShell tool sidecar (windows/amd64):

    ```powershell
    irm https://raw.githubusercontent.com/BLuchterhand/idiom/main/install-tools.ps1 | iex
    ```

    See the [README's release install section](https://github.com/BLuchterhand/idiom#release-install-after-a-tagged-release) for supported profiles, platforms, and override knobs (`IDIOM_VERSION`, `IDIOM_INSTALL_DIR`, `IDIOM_REPO`, `IDIOM_RELEASE_URL_BASE`).

    Or grab the matching release asset above for darwin/linux amd64 or arm64, or windows/amd64.
