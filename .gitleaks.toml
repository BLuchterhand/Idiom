# Keep upstream detectors enabled. These exceptions match reviewed synthetic
# fixture lines, generated Windows declarations, or a historical Git revision;
# never whole directories.
title = "Idiom secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Reviewed synthetic fixture"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)internal/contracts/planartifact/validate_test\.go$''']
regexes = [
  '''^\s*Purpose:\ "password=abcdef123456",\s*$''',
  '''^\s*artifact\.Rationale\ =\ "api_key=abcdef123456"\s*$''',
]

[[allowlists]]
description = "Reviewed synthetic fixture"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)internal/surfaces/cli/root/development_workflows_e2e_test\.go$''']
regexes = [
  '''^\s*promptSecret\ :=\ "PRIVATE\-INCIDENT\-4711"\s*$''',
]

[[allowlists]]
description = "Reviewed synthetic fixture"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)internal/workflows/recovery/redaction_test\.go$''']
regexes = [
  '''^\s*ginkgo\.Entry\("AWS\ access\ key",\ "aws=AKIA1234567890ABCD"\),\s*$''',
]

[[allowlists]]
description = "Reviewed synthetic fixture"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)internal/contracts/sensitivity/sensitivity_test\.go$''']
regexes = [
  '''^\s*"secret\ abc123",\n\	\	"sk\-1234567890abcdef",\s*$''',
]

[[allowlists]]
description = "Reviewed synthetic fixture"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)internal/util/redact_test\.go$''']
regexes = [
  '''^\s*\{"apiKey\ colon\ with\ openai\ key\ value",\ `"apiKey":\ "sk\-abc123def456"`,\ `"apiKey":\ "<redacted\-secret>"`\},\s*$''',
  '''^\s*\{"api_key\ assignment",\ `api_key=mysecret123`,\ `api_key=<redacted>`\},\s*$''',
  '''^\s*\{"multiple\ secrets",\ `api_key=secret1\ token=secret2`,\ `api_key=<redacted>\ token=<redacted>`\},\s*$''',
  '''^\s*\{"openai\ key",\ `key=sk\-abcdefghijklmnopqrstuv`,\ `key=<redacted\-secret>`\},\s*$''',
]

[[allowlists]]
description = "Reviewed synthetic fixture"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)internal/workspace/tool_sidecar_envelope_test\.go$''']
regexes = [
  '''^\s*\{name:\ "jwt\ shaped",\ callerID:\ "eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0In0\.sflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"\},\s*$''',
]

[[allowlists]]
description = "Reviewed synthetic fixture / git revision"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)docs/local\-model\-planning\-quality\-design\.md$''']
regexes = [
  '''^\s*"git_head":\ "adb592f5c4386533fb3523000a917a0619761b48",\s*$''',
]

[[allowlists]]
description = "Vendored SQLite generated Windows API declarations, not credentials"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)vendor/modernc\.org/sqlite/lib/sqlite_windows\.go$''']
regexes = [
  '''^\s*const\ BCRYPT_AES_WRAP_KEY_BLOB\ =\ "Rfc3565KeyWrapBlob"\s*$''',
  '''^\s*const\ NCRYPT_PKCS8_PRIVATE_KEY_BLOB\ =\ "PKCS8_PRIVATEKEY"\s*$''',
  '''^\s*const\ szOID_CERT_STRONG_KEY_OS_CURRENT\ =\ "szOID_CERT_STRONG_KEY_OS_1"\s*$''',
  '''^\s*type\ BCRYPT_DSA_KEY_BLOB_V2\ =\ TBCRYPT_DSA_KEY_BLOB_V2\s*$''',
  '''^\s*type\ DHPRIVKEY_VER3\ =\ TDHPRIVKEY_VER3\s*$''',
  '''^\s*type\ PBCRYPT_DSA_KEY_BLOB_V2\ =\ TPBCRYPT_DSA_KEY_BLOB_V2\s*$''',
  '''^\s*type\ T_BCRYPT_DSA_KEY_BLOB_V2\ =\ TBCRYPT_DSA_KEY_BLOB_V2\s*$''',
  '''^\s*type\ T_PRIVKEYVER3\ =\ TDHPRIVKEY_VER3\s*$''',
  '''^\s*type\ _BCRYPT_DSA_KEY_BLOB_V2\ =\ T_BCRYPT_DSA_KEY_BLOB_V2\s*$''',
]

[[allowlists]]
description = "Vendored SQLite generated Windows API declarations, not credentials"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)vendor/modernc\.org/sqlite/lib/sqlite_windows_386\.go$''']
regexes = [
  '''^\s*const\ BCRYPT_AES_WRAP_KEY_BLOB\ =\ "Rfc3565KeyWrapBlob"\s*$''',
  '''^\s*const\ NCRYPT_PKCS8_PRIVATE_KEY_BLOB\ =\ "PKCS8_PRIVATEKEY"\s*$''',
  '''^\s*const\ szOID_CERT_STRONG_KEY_OS_CURRENT\ =\ "szOID_CERT_STRONG_KEY_OS_1"\s*$''',
  '''^\s*type\ BCRYPT_DSA_KEY_BLOB_V2\ =\ TBCRYPT_DSA_KEY_BLOB_V2\s*$''',
  '''^\s*type\ DHPRIVKEY_VER3\ =\ TDHPRIVKEY_VER3\s*$''',
  '''^\s*type\ PBCRYPT_DSA_KEY_BLOB_V2\ =\ TPBCRYPT_DSA_KEY_BLOB_V2\s*$''',
  '''^\s*type\ T_BCRYPT_DSA_KEY_BLOB_V2\ =\ TBCRYPT_DSA_KEY_BLOB_V2\s*$''',
  '''^\s*type\ T_PRIVKEYVER3\ =\ TDHPRIVKEY_VER3\s*$''',
  '''^\s*type\ _BCRYPT_DSA_KEY_BLOB_V2\ =\ T_BCRYPT_DSA_KEY_BLOB_V2\s*$''',
]
