[package]
name = "idiom-desktop"
version = "0.1.0"
description = "Dedicated desktop shell for Idiom"
authors = ["Idiom"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5.0", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
