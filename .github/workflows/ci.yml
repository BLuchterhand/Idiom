name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: test
        run: go test ./...

  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: validate snapshot assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          test -f dist/SHA256SUMS

          targets=(
            darwin_amd64:tar.gz:idiom
            darwin_arm64:tar.gz:idiom
            linux_amd64:tar.gz:idiom
            linux_arm64:tar.gz:idiom
            windows_amd64:zip:idiom.exe
          )

          for target in "${targets[@]}"; do
            IFS=: read -r platform format binary_name <<<"${target}"
            matches=(dist/idiom_*_"${platform}"."${format}")
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "expected exactly one ${platform}.${format} archive, found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi

            archive="${matches[0]}"
            asset="$(basename "${archive}")"
            awk -v want="${asset}" '$2 == want {found = 1} END {exit found ? 0 : 1}' dist/SHA256SUMS

            case "${format}" in
              tar.gz)
                tar -tzf "${archive}" | awk -v want="${binary_name}" '
                  $0 == want || $0 ~ "/" want "$" {found = 1}
                  END {exit found ? 0 : 1}
                '
                ;;
              zip)
                unzip -Z1 "${archive}" | awk -v want="${binary_name}" '
                  $0 == want || $0 ~ "/" want "$" {found = 1}
                  END {exit found ? 0 : 1}
                '
                ;;
            esac

            echo "validated ${asset}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
          retention-days: 1

  install-linux:
    needs: release-snapshot
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: full install.sh validation from snapshot dist
        run: |
          IDIOM_TEST_DIST="${PWD}/dist" \
          IDIOM_TEST_GOARCH="${{ matrix.goarch }}" \
          ./scripts/test-install-docker.sh

  install-macos:
    needs: release-snapshot
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
          - runner: macos-15
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: full install.sh validation from snapshot dist
        shell: bash
        run: |
          set -euo pipefail
          IDIOM_TEST_DIST="${PWD}/dist" \
          IDIOM_TEST_GOARCH="${{ matrix.goarch }}" \
          IDIOM_INSTALL_DIR="${RUNNER_TEMP}/idiom-bin" \
          ./scripts/test-install-macos.sh

  install-dependencies-macos:
    needs: release-snapshot
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
          - runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: install and validate discovery dependencies
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/idiom-bin"
          IDIOM_INSTALL_DIR="${install_dir}" ./scripts/install-snapshot-from-dist.sh --profile full --no-queue
          echo "${install_dir}" >> "$GITHUB_PATH"
          ./scripts/test-install-dependencies.sh
          IDIOM_BIN="${install_dir}/idiom" python3 scripts/test-post-install-harness.py
          IDIOM_BIN="${install_dir}/idiom" IDIOM_TOOL_BIN="${install_dir}/idiom-tool" ./scripts/test-discovery-tools-e2e.sh

  install-dependencies-linux:
    needs: release-snapshot
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: install and validate discovery dependencies
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/idiom-bin"
          IDIOM_INSTALL_DIR="${install_dir}" ./scripts/install-snapshot-from-dist.sh --profile full --no-queue
          echo "${install_dir}" >> "$GITHUB_PATH"
          ./scripts/test-install-dependencies.sh
          IDIOM_BIN="${install_dir}/idiom" python3 scripts/test-post-install-harness.py
          IDIOM_BIN="${install_dir}/idiom" IDIOM_TOOL_BIN="${install_dir}/idiom-tool" ./scripts/test-discovery-tools-e2e.sh

  install-windows:
    needs: release-snapshot
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: PowerShell install validation from snapshot dist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = @(Get-ChildItem -Path dist -Filter "idiom_*_windows_amd64.zip")
          if ($archive.Count -ne 1) {
            throw "expected exactly one windows/amd64 archive, found $($archive.Count)"
          }
          $version = $archive[0].Name -replace '^idiom_', '' -replace '_windows_amd64\.zip$', ''

          $server = Start-Process -FilePath python -ArgumentList @("-m", "http.server", "8080", "--bind", "127.0.0.1", "--directory", "dist") -PassThru -WindowStyle Hidden
          try {
            for ($i = 0; $i -lt 10; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8080/SHA256SUMS" | Out-Null
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }

            $installDir = Join-Path $env:RUNNER_TEMP "idiom-bin"
            $env:IDIOM_VERSION = $version
            $env:IDIOM_RELEASE_URL_BASE = "http://127.0.0.1:8080"
            $env:IDIOM_INSTALL_DIR = $installDir
            ./install.ps1 -Profile Full
            & (Join-Path $installDir "idiom.exe") version | Select-String -SimpleMatch "version: $version" | Out-Null
            & (Join-Path $installDir "idiom-tool.cmd") list --profile discovery | Out-Null

            $beforeHash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $installDir "idiom.exe")).Hash
            ./install-tools.ps1
            $afterHash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $installDir "idiom.exe")).Hash
            if ($beforeHash -ne $afterHash) {
              throw "install-tools.ps1 changed existing idiom.exe"
            }
            & (Join-Path $installDir "idiom-tool.cmd") list --profile discovery | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "idiom-tool.cmd verification failed"
            }

            $env:Path = "$installDir;$env:Path"
            ./scripts/test-install-dependencies.ps1
            $env:IDIOM_BIN = Join-Path $installDir "idiom.exe"
            python scripts/test-post-install-harness.py
            Remove-Item Env:IDIOM_TOOL_BIN -ErrorAction SilentlyContinue
            python scripts/test-discovery-tools-e2e.py
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
