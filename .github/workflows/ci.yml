name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: test
        run: go test ./...
      - name: generated mocks are current
        run: make verify-mocks
      - name: hermetic end-to-end tests
        run: make test-e2e
      - name: software-development scenarios
        run: make test-development-scenarios

  scripted-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: scripted real-binary behavior and lane contracts
        run: make scripted-contracts-ci

  race-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: concurrency ownership contracts
        run: make test-race-contracts

  commandexec-native:
    name: commandexec (${{ matrix.target }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: windows-amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: native process lifecycle contracts
        run: go test ./internal/platform/commandexec -count=1
      - name: native process lifecycle race contracts
        run: go test -race ./internal/platform/commandexec -count=1

  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: validate snapshot assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          test -f dist/SHA256SUMS

          targets=(
            darwin_amd64:tar.gz:idiom
            darwin_arm64:tar.gz:idiom
            linux_amd64:tar.gz:idiom
            linux_arm64:tar.gz:idiom
            windows_amd64:zip:idiom.exe
          )

          for target in "${targets[@]}"; do
            IFS=: read -r platform format binary_name <<<"${target}"
            matches=(dist/idiom_*_"${platform}"."${format}")
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "expected exactly one ${platform}.${format} archive, found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi

            archive="${matches[0]}"
            asset="$(basename "${archive}")"
            awk -v want="${asset}" '$2 == want {found = 1} END {exit found ? 0 : 1}' dist/SHA256SUMS

            case "${format}" in
              tar.gz)
                tar -tzf "${archive}" | awk -v want="${binary_name}" '
                  $0 == want || $0 ~ "/" want "$" {found = 1}
                  END {exit found ? 0 : 1}
                '
                ;;
              zip)
                unzip -Z1 "${archive}" | awk -v want="${binary_name}" '
                  $0 == want || $0 ~ "/" want "$" {found = 1}
                  END {exit found ? 0 : 1}
                '
                ;;
            esac

            echo "validated ${asset}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
          retention-days: 1

  install-linux:
    needs: release-snapshot
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: full install.sh validation from snapshot dist
        run: |
          IDIOM_SYSTEM_TARGETED=1 \
          IDIOM_TEST_DIST="${PWD}/dist" \
          IDIOM_TEST_GOARCH="${{ matrix.goarch }}" \
          go tool ginkgo --tags=system_test --fail-fast --label-filter='system-install-docker' --fail-on-empty ./internal/systemtests

  install-macos:
    needs: release-snapshot
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
          - runner: macos-15
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: full install.sh validation from snapshot dist
        shell: bash
        run: |
          set -euo pipefail
          IDIOM_TEST_DIST="${PWD}/dist" \
          IDIOM_TEST_GOARCH="${{ matrix.goarch }}" \
          IDIOM_INSTALL_DIR="${RUNNER_TEMP}/idiom-bin" \
          IDIOM_SYSTEM_TARGETED=1 \
          go tool ginkgo --tags=system_test --fail-fast --label-filter='system-install-macos' --fail-on-empty ./internal/systemtests

  install-dependencies-macos:
    needs: release-snapshot
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
          - runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: install and validate discovery dependencies
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/idiom-bin"
          IDIOM_INSTALL_DIR="${install_dir}" ./scripts/install-snapshot-from-dist.sh --profile full --no-queue
          echo "${install_dir}" >> "$GITHUB_PATH"
          IDIOM_SYSTEM_TARGETED=1 go tool ginkgo --tags=system_test --fail-fast --label-filter='system-install-dependencies-unix-live' --fail-on-empty ./internal/systemtests
          IDIOM_SYSTEM_TARGETED=1 IDIOM_BIN="${install_dir}/idiom" go tool ginkgo --tags=system_test --fail-fast --label-filter='system-post-install-harness' --fail-on-empty ./internal/systemtests
          IDIOM_SYSTEM_TARGETED=1 IDIOM_BIN="${install_dir}/idiom" IDIOM_TOOL_BIN="${install_dir}/idiom-tool" go tool ginkgo --tags=system_test --fail-fast --label-filter='system-discovery-tools' --fail-on-empty ./internal/systemtests

  install-dependencies-linux:
    needs: release-snapshot
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: install and validate discovery dependencies
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/idiom-bin"
          IDIOM_INSTALL_DIR="${install_dir}" ./scripts/install-snapshot-from-dist.sh --profile full --no-queue
          echo "${install_dir}" >> "$GITHUB_PATH"
          IDIOM_SYSTEM_TARGETED=1 go tool ginkgo --tags=system_test --fail-fast --label-filter='system-install-dependencies-unix-live' --fail-on-empty ./internal/systemtests
          IDIOM_SYSTEM_TARGETED=1 IDIOM_BIN="${install_dir}/idiom" go tool ginkgo --tags=system_test --fail-fast --label-filter='system-post-install-harness' --fail-on-empty ./internal/systemtests
          IDIOM_SYSTEM_TARGETED=1 IDIOM_BIN="${install_dir}/idiom" IDIOM_TOOL_BIN="${install_dir}/idiom-tool" go tool ginkgo --tags=system_test --fail-fast --label-filter='system-discovery-tools' --fail-on-empty ./internal/systemtests

  install-windows:
    needs: release-snapshot
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: PowerShell install validation from snapshot dist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = @(Get-ChildItem -Path dist -Filter "idiom_*_windows_amd64.zip")
          if ($archive.Count -ne 1) {
            throw "expected exactly one windows/amd64 archive, found $($archive.Count)"
          }
          $version = $archive[0].Name -replace '^idiom_', '' -replace '_windows_amd64\.zip$', ''

          $server = Start-Process -FilePath python -ArgumentList @("-m", "http.server", "8080", "--bind", "127.0.0.1", "--directory", "dist") -PassThru -WindowStyle Hidden
          try {
            for ($i = 0; $i -lt 10; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8080/SHA256SUMS" | Out-Null
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }

            $installDir = Join-Path $env:RUNNER_TEMP "idiom-bin"
            $env:IDIOM_VERSION = $version
            $env:IDIOM_RELEASE_URL_BASE = "http://127.0.0.1:8080"
            $env:IDIOM_INSTALL_DIR = $installDir
            ./install.ps1 -Profile Full
            $env:IDIOM_SYSTEM_TARGETED = "1"
            go tool ginkgo --tags=system_test --fail-fast --label-filter='system-install-windows-integrity' --fail-on-empty ./internal/systemtests

            $env:Path = "$installDir;$env:Path"
            go tool ginkgo --tags=system_test --fail-fast --label-filter='system-install-dependencies-powershell-live' --fail-on-empty ./internal/systemtests
            $env:IDIOM_BIN = Join-Path $installDir "idiom.exe"
            go tool ginkgo --tags=system_test --fail-fast --label-filter='system-post-install-harness' --fail-on-empty ./internal/systemtests
            Remove-Item Env:IDIOM_TOOL_BIN -ErrorAction SilentlyContinue
            go tool ginkgo --tags=system_test --fail-fast --label-filter='system-discovery-tools' --fail-on-empty ./internal/systemtests
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
