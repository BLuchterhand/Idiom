name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  artifacts:
    needs: verify
    uses: ./.github/workflows/release-artifacts.yml
    with:
      snapshot: false

  publish:
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist
      - name: Validate the tested release assets
        run: python3 scripts/validate-release-assets.py dist
      - name: Publish the tested archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/idiom_*.tar.gz dist/idiom_*.zip dist/SHA256SUMS \
            --verify-tag --generate-notes "${flags[@]}"
